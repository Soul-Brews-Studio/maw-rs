[package]
name = "maw-cli"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "maw-rs"
path = "src/main.rs"

[features]
default = []
wasm-host = ["maw-plugin-manifest/wasm-host"]

[dependencies]
maw-activity = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-auto-wake = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-auth = { path = "../maw-auth" }
maw-bring = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-bind = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-calver = { git = "https://github.com/Soul-Brews-Studio/maw-calver", rev = "8e97ae8814990bbd3b3766cb5e0bc4064c57e859" }
maw-feed = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-fuzzy = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-identity = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-hub = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-matcher = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-peer = { path = "../maw-peer" }
maw-plugin-manifest = { path = "../maw-plugin-manifest" }
maw-plugin-scaffold = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-policy = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-routing = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-schedule = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-schedule-launchd = { git = "https://github.com/Soul-Brews-Studio/maw-schedule-runtime", rev = "ba95c3f7c0b987509b4fe906e8375d6b4e6bc402" }
maw-schedule-runner = { git = "https://github.com/Soul-Brews-Studio/maw-schedule-runtime", rev = "ba95c3f7c0b987509b4fe906e8375d6b4e6bc402" }
maw-split = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-tmux = { path = "../maw-tmux" }
maw-transport = { path = "../maw-transport" }
maw-worktree = { git = "https://github.com/Soul-Brews-Studio/maw-worktree", rev = "1449cff00fbbc03eef82de4daa710c194a1e14de" }
maw-xdg = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
futures-util = "0.3"
rand = "0.8"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio.workspace = true

[dev-dependencies]
maw-activity = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4", features = ["fixtures"] }
maw-matcher = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4", features = ["fixtures"] }
maw-worktree = { git = "https://github.com/Soul-Brews-Studio/maw-worktree", rev = "1449cff00fbbc03eef82de4daa710c194a1e14de", features = ["fixtures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

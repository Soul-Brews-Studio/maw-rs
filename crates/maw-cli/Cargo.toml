[package]
name = "maw-cli"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "maw-rs"
path = "src/main.rs"

[features]
default = []
wasm-host = ["maw-plugin-manifest/wasm-host"]

[dependencies]
maw-activity = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-auto-wake = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-auth = { path = "../maw-auth" }
maw-bring = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-bind = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-calver = { git = "https://github.com/Soul-Brews-Studio/maw-calver", rev = "c74522b2b7cb5b831c456b2a2fa333849aa85eef" }
maw-feed = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-fuzzy = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-identity = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-hub = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-matcher = { path = "../maw-matcher" }
maw-peer = { path = "../maw-peer" }
maw-plugin-manifest = { path = "../maw-plugin-manifest" }
maw-plugin-scaffold = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-policy = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-routing = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-schedule = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-schedule-launchd = { path = "../maw-schedule-launchd" }
maw-schedule-runner = { path = "../maw-schedule-runner" }
maw-split = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "fca1129df488ba80180bda567b3e0c2952e9f0f5" }
maw-tmux = { path = "../maw-tmux" }
maw-transport = { path = "../maw-transport" }
maw-worktree = { path = "../maw-worktree" }
maw-xdg = { path = "../maw-xdg" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
futures-util = "0.3"
rand = "0.8"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio.workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

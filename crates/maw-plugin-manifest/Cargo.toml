[package]
name = "maw-plugin-manifest"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
wasm-host = ["dep:extism"]

[dependencies]
base64 = "0.22"
extism = { version = "1.30.0", optional = true }
maw-policy = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
maw-tmux = { path = "../maw-tmux" }
maw-transport = { path = "../maw-transport" }
maw-xdg = { git = "https://github.com/Soul-Brews-Studio/maw-crates", rev = "e46932081dfd1a20bb962506086f1befe5525fa4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio.workspace = true
url = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[lints]
workspace = true

[workspace]
members = ["crates/maw-worktree", "crates/maw-transport", "crates/maw-schedule-launchd", "crates/maw-schedule-runner", "crates/maw-tmux", "crates/maw-peer", "crates/maw-auth", "crates/maw-xdg", "crates/maw-plugin-manifest", "crates/maw-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/Soul-Brews-Studio/maw-rs"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

name: CI

# Per-push/PR CI disabled 2026-07-03 (Nat): gating happens locally (Rust builds on m5);
# CI runs on a 4-hour schedule as a safety net, plus manual dispatch.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    # Self-hosted runner deferred until TK's Linux test server is ready.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # "Fleet-plugin bun tests" moved to Soul-Brews-Studio/maw-plugins CI
      # (fleet-bun-tests job) with the fleet-plugins/ -> packages/ extraction
      # (repo split phase 1, 2026-07-15).

      # The "Build deterministic AssemblyScript WASM fixtures" step
      # (packages/wasm-sdk check:fixtures) moved to
      # Soul-Brews-Studio/maw-fixtures with the wasm fixture + examples/
      # extraction (repo split phase 2, 2026-07-16).

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: true
          cache-targets: true

      - name: Fetch Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace tests
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo build --workspace --tests --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Test workspace
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  musl-static:
    name: MUSL static Extism linkability
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build maw-cli for musl static
        # --features wasm-host is REQUIRED here: with empty default features this
        # job would stop linking Extism, silently voiding its whole purpose.
        run: cargo build --release --target x86_64-unknown-linux-musl -p maw-cli --features wasm-host

  wasm-host:
    name: wasm-host feature (invoke/parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-wasm-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: true
          cache-targets: true

      - name: Test with wasm-host feature
        env:
          CARGO_BUILD_JOBS: 2
          # No debuginfo: each test binary links the full Extism/wasmtime
          # runtime; with debug info the links OOM the runner's linker
          # (ld terminated with signal 7 [Bus error]).
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p maw-cli -p maw-plugin-manifest --features wasm-host --locked

      - name: Clippy with wasm-host feature
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo clippy -p maw-cli -p maw-plugin-manifest --all-targets --features wasm-host --locked -- -D warnings

  # The maw-menubar-native macOS job (helper sha256 pin + lipo slices +
  # codesign + rebuild) moved to Soul-Brews-Studio/maw-plugins CI with the
  # fleet-plugins/ -> packages/ extraction (repo split phase 1, 2026-07-15).

name: CI

# Per-push/PR CI disabled 2026-07-03 (Nat): gating happens locally (Rust builds on m5);
# CI runs on a 4-hour schedule as a safety net, plus manual dispatch.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Supersede a redundant duplicate run on the same ref (e.g. a manual
# workflow_dispatch fired during an in-flight scheduled run, or a run
# overrunning its 4h window). A superseded run reports as 'cancelled', never
# 'success' — the newer run re-executes the identical fmt/test/clippy checks,
# so no gate is skipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI has no cross-run incremental reuse (each scheduled run starts from the
# rust-cache restore, not a prior incremental target dir), so incremental
# codegen units only bloat the target dir + the saved cache with no compile
# win. Disabling it shrinks every job's target dir → smaller/faster caches and
# better hit-rate under GitHub's 10 GB per-repo cache cap (matters now that the
# musl job also caches, adding a third large key). OOM-neutral: touches neither
# the debuginfo strip nor CARGO_BUILD_JOBS, so it cannot re-approach #543.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust workspace
    # Self-hosted runner deferred until TK's Linux test server is ready.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true

      # rust-toolchain.toml at the repo root is the single source of truth for
      # channel + components + targets (#823). `rustup toolchain install` with
      # NO arguments installs exactly what that file names, so CI and every
      # developer box judge with the same rustc — the file overrides the
      # default toolchain inside the checkout, so no `rustup default` is needed.
      #
      # This used to say `rustup toolchain install stable`, which pinned
      # nothing: a scheduled run got whatever stable was that day (1.97.1 on
      # 2026-08-16) while a dev box that had not run `rustup update` since March
      # was still on 1.94.0 — and the two disagreed about
      # clippy::redundant_iter_cloned on the same commit. The hand-added
      # `rustup target add wasm32-unknown-unknown` is likewise gone: it lives in
      # `targets` in the toolchain file now, where a developer can also see it.
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          rustup target list --installed

      # "Install Bun" (oven-sh/setup-bun) removed 2026-07-16: its only consumers
      # ("Fleet-plugin bun tests" + AssemblyScript fixture build) were extracted
      # to maw-plugins / maw-fixtures (see the moved-step comments below), so
      # nothing remaining in this job uses Bun.

      # "Fleet-plugin bun tests" moved to Soul-Brews-Studio/maw-plugins CI
      # (fleet-bun-tests job) with the fleet-plugins/ -> packages/ extraction
      # (repo split phase 1, 2026-07-15).

      # The "Build deterministic AssemblyScript WASM fixtures" step
      # (packages/wasm-sdk check:fixtures) moved to
      # Soul-Brews-Studio/maw-fixtures with the wasm fixture + examples/
      # extraction (repo split phase 2, 2026-07-16).

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # shared-key is a STABLE prefix only. rust-cache already hashes
          # Cargo.lock/Cargo.toml + the rustc version into its internal key and
          # auto-prefixes runner.os, with restore-key fallback. Baking
          # hashFiles('**/Cargo.lock') into the prefix (old behavior) cold-caches
          # the whole extism/wasmtime stack on every dependency bump. Keep this
          # prefix DISTINCT from the wasm-host job: that job builds
          # --features wasm-host (different artifacts) and must not
          # cross-contaminate this workspace cache.
          shared-key: rust-workspace
          cache-all-crates: true
          cache-targets: true
          # Persist the rebuilt target dir even when the job fails. All recent
          # scheduled runs are RED (real clippy/test reds), and rust-cache only
          # saves on SUCCESS by default — so the extism/workspace stack was
          # recompiling COLD every 4h. cache-on-failure lets a red run still
          # save its artifacts, so the next run restores warm.
          cache-on-failure: true

      # Retry loop is insurance against transient crates.io/registry network
      # blips on shared runners — NOT for the current fmt/test reds. It only
      # exit 0s when cargo actually succeeds, so a real failure still fails.
      - name: Fetch Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      # scripts/gate.sh full runs this same format dimension locally. Keep the
      # command aligned so local merge evidence and scheduled CI judge the same tree.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace tests
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
          # Strip debuginfo (same mechanism as the #543 fix on wasm-host/musl,
          # applied here purely as a speed/size win — this job does NOT link the
          # extism stack, so it was never at OOM risk). Faster links + a smaller
          # target dir → smaller/faster cache. This can only REDUCE link memory,
          # never increase it, so it cannot reintroduce #543.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo build --workspace --tests --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Test workspace
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        # --no-fail-fast: without it cargo halts at the FIRST failing test
        # target, so a red CI run under-reports the true failure set and the
        # next fix round trips on failures it never saw (#796).
        run: cargo test --workspace --locked --no-fail-fast

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  musl-static:
    name: MUSL static Extism linkability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Install the pinned toolchain first (#823), then add musl on top of it —
      # `rustup target add` attaches the target to whatever toolchain is active,
      # and inside the checkout that is the one rust-toolchain.toml names.
      - name: Install Rust musl target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          rustc --version

      # This job previously had NO cache at all — it rebuilt the entire
      # ~145-crate cranelift/extism stack for the musl target COLD every 4h,
      # ~400s of pure cold compile. Add rust-cache with a DISTINCT shared-key
      # (rust-musl): the musl target dir must never cross-contaminate the
      # workspace (rust-workspace) or wasm-host (rust-wasm-host) caches — those
      # are different targets/features. cache-on-failure persists artifacts even
      # though this whole job is continue-on-error. OOM-neutral: caching changes
      # WHAT is recompiled, not HOW it is linked — the debuginfo strip is
      # unaffected (this job's build still runs at the release profile without
      # the CARGO_PROFILE_*_DEBUG override, unchanged from before).
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-musl
          cache-all-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Build maw-cli for musl static
        # --features wasm-host is REQUIRED here: with empty default features this
        # job would stop linking Extism, silently voiding its whole purpose.
        run: cargo build --release --target x86_64-unknown-linux-musl -p maw-cli --features wasm-host

  wasm-host:
    name: wasm-host feature (invoke/parity)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Disk-exhaustion guard: this job links the entire Extism/wasmtime runtime
      # into every test binary, producing large intermediate artifacts. NOTE:
      # this is a DISK guard only — #543's linker OOM (ld signal 7 / bus error)
      # is a MEMORY problem fixed by the CARGO_PROFILE_*_DEBUG=0 strip below, not
      # by freeing disk. Both are needed; neither substitutes for the other.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: true

      # Same pin as the rust job — see its Install step for why (#823). This
      # job is where the wasm32 target actually earns its keep: the wasm-host
      # tests cross-compile plugin fixtures to wasm32-unknown-unknown.
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          rustup target list --installed

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # STABLE prefix, DISTINCT from the rust job (this builds
          # --features wasm-host — different artifacts). See the rust job's Cache
          # Cargo comment for why hashFiles() is deliberately not baked in here.
          shared-key: rust-wasm-host
          cache-all-crates: true
          cache-targets: true
          # Persist the extism/wasmtime target dir even on a red run (all recent
          # scheduled runs fail), so the next run restores warm instead of
          # recompiling the ~145-crate cranelift stack cold. OOM-neutral: a cache
          # restore adds no link memory; the debuginfo strip below is untouched.
          cache-on-failure: true

      # Pre-warm the registry with the same 3x network-retry as the rust job.
      # Wraps ONLY `cargo fetch` (a pure network op) — NEVER the test step, so it
      # cannot mask the wasm-host test-isolation races.
      - name: Fetch Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      # scripts/gate.sh full runs this same wasm-host dimension locally. Keep
      # the command aligned so local merge evidence and CI cover the same feature set.
      - name: Test with wasm-host feature
        env:
          CARGO_BUILD_JOBS: 2
          # No debuginfo: each test binary links the full Extism/wasmtime
          # runtime; with debug info the links OOM the runner's linker
          # (ld terminated with signal 7 [Bus error]).
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        # --no-fail-fast: report every failing target in one run, not just the
        # first (#796).
        run: cargo test -p maw-cli -p maw-plugin-manifest --features wasm-host --locked --no-fail-fast

      - name: Clippy with wasm-host feature
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo clippy -p maw-cli -p maw-plugin-manifest --all-targets --features wasm-host --locked -- -D warnings

  # The maw-menubar-native macOS job (helper sha256 pin + lipo slices +
  # codesign + rebuild) moved to Soul-Brews-Studio/maw-plugins CI with the
  # fleet-plugins/ -> packages/ extraction (repo split phase 1, 2026-07-15).

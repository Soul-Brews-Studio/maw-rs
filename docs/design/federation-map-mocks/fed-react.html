<meta charset="utf-8"><title>maw federation · fleet map</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--tx:#c9d1d9;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--self:#58a6ff}
body{background:var(--bg);color:var(--tx);font:13px ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:24px}
h1{font-size:18px;margin:0 0 3px;color:#fff}.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;max-width:1180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-left-width:3px}
.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}
.card.self{border-left-color:var(--self);background:#121a2b}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-size:14px;font-weight:700;color:#fff}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.chip.ok{background:#12311c;color:var(--ok)}.chip.warn{background:#2d2410;color:var(--warn)}
.chip.bad{background:#341316;color:var(--bad)}.chip.self{background:#132038;color:var(--self)}
.meta{color:var(--mut);font-size:10.5px;margin:6px 0 2px;line-height:1.65}
.meta b{color:var(--tx);font-weight:600}
.flag{display:inline-block;background:#341316;color:var(--bad);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;margin:3px 4px 0 0}
.fleet{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.fl-h{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.s{display:flex;align-items:center;gap:6px;padding:1.5px 0;font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.live{background:var(--ok)}.idle{background:var(--warn)}.dead{background:#484f58}
.more{color:var(--mut);font-size:10.5px;margin-top:3px;cursor:pointer}
.none{color:#484f58;font-size:11px;font-style:italic}
.foot{color:#484f58;margin-top:16px;font-size:11px}
</style>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script type="module">
import htm from 'https://unpkg.com/htm?module';
const html = htm.bind(React.createElement);
const { useState } = React;

// ── in the real /fed page this is: await fetch('/fed.json')  (served OUTSIDE the /api/ token gate)
const DATA = {
  self: { name:'m5', oracle:'maw-rs', version:'26.7.23-alpha.1711', bind:'0.0.0.0:3456', token:null,
    fleet:[['33-maw-rs','live'],['32-muninn','live'],['102-dustboy-phd','live'],['ajfon-oracle','live'],
           ['inverted-pendulum-oracle','live'],['64-noah','idle'],['41-arra-oracle-v3','idle'],['ui-oracle','idle'],
           ['usage-fleet','idle'],['31-black','dead'],['60-digger','dead'],['57-mother','dead'],
           ['48-atlas','dead'],['63-homekeeper','dead'],['30-display-census','dead'],['28-argus','dead'],
           ['17-ai-party','dead'],['08-gpu','dead'],['06-facebook-timeline','dead'],['oracle-book-skills','dead']] },
  peers: [
    { alias:'blackmachine', url:'black.local:3456', ip:'192.168.1.184', node:'local', oracle:'mawjs',
      version:'26.7.23-alpha.1617', reach:'OK', send:'401', flags:['node!unique','oracle=default','ver-skew'],
      fleet:[['33-maw-rs','dead'],['vt-monitor','live'],['vt-quad','live'],['vt-split','live'],['vt-golden','idle']] },
    { alias:'white', url:'10.20.0.7:3456', ip:'10.20.0.7', node:'white', oracle:'mawjs', version:'?',
      reach:'OK', send:'?', flags:['oracle=default'],
      fleet:[['05-volt','live'],['38-thongpraditbrewing','live'],['fb-serve','live']] },
    { alias:'white-lan', url:'white.local:3456', ip:'192.168.1.7', node:'white', oracle:'mawjs', version:'?',
      reach:'OK', send:'?', flags:['dup-of white'],
      fleet:[['05-volt','live'],['38-thongpraditbrewing','live'],['fb-serve','live']] },
    { alias:'m5', url:'m5:3456', ip:'127.0.0.1', node:'—', oracle:'—', version:'—',
      reach:'TIMEOUT', send:'—', flags:['loopback→self'], fleet:[] },
    { alias:'arra', url:'m5.local:47778', ip:'127.0.0.1', node:'arra@m5', oracle:'arra', version:'—',
      reach:'HTTP_4XX', send:'—', flags:[], fleet:[] },
    { alias:'oracle-world', url:'10.20.0.16:3456', ip:'?', node:'—', oracle:'—', version:'—',
      reach:'REFUSED', send:'—', flags:[], fleet:[] },
    { alias:'oracle-world-sila', url:'10.20.0.16:3457', ip:'?', node:'—', oracle:'—', version:'—',
      reach:'REFUSED', send:'—', flags:[], fleet:[] },
    { alias:'oracle-world-oracle', url:'world.wg:3463', ip:'?', node:'—', oracle:'—', version:'—',
      reach:'REFUSED', send:'—', flags:[], fleet:[] },
    { alias:'white-noah', url:'white.wg:3467', ip:'?', node:'—', oracle:'—', version:'—',
      reach:'REFUSED', send:'—', flags:[], fleet:[] },
  ]
};

const rank = p => p.flags.includes('loopback→self') ? 'warn'
  : p.reach === 'OK' ? (p.send === '401' ? 'warn' : 'ok')
  : p.reach === 'HTTP_4XX' ? 'warn' : 'bad';

function Fleet({ fleet }) {
  const [all, setAll] = useState(false);
  if (!fleet.length) return html`<div class="fleet"><div class="none">no fleet visible</div></div>`;
  const live = fleet.filter(f => f[1] === 'live').length;
  const show = all ? fleet : fleet.slice(0, 5);
  return html`<div class="fleet">
    <div class="fl-h">fleet · ${live} live / ${fleet.length}</div>
    ${show.map(([n, st]) => html`<div class="s" key=${n}><span class="dot ${st}"></span>${n}</div>`)}
    ${fleet.length > 5 && html`<div class="more" onClick=${() => setAll(!all)}>
      ${all ? '− less' : `+ ${fleet.length - 5} more`}</div>`}
  </div>`;
}

const Card = ({ p }) => html`<div class="card ${rank(p)}">
  <div class="hd"><span class="nm">${p.alias}</span>
    <span class="chip ${rank(p)}">${p.reach}${p.send === '401' ? ' · send 401' : ''}</span></div>
  <div class="meta"><b>${p.ip}</b> · ${p.url}<br/>node <b>${p.node}</b> · oracle <b>${p.oracle}</b><br/>ver <b>${p.version}</b></div>
  ${p.flags.map(f => html`<span class="flag" key=${f}>${f}</span>`)}
  <${Fleet} fleet=${p.fleet} />
</div>`;

const Self = ({ s }) => html`<div class="card self">
  <div class="hd"><span class="nm">${s.name}</span><span class="chip self">self</span></div>
  <div class="meta">oracle <b>${s.oracle}</b><br/>ver <b>${s.version}</b><br/>bind <b>${s.bind}</b> · token <b style="color:var(--bad)">${s.token || 'none ⚠'}</b></div>
  <${Fleet} fleet=${s.fleet} />
</div>`;

function App() {
  const ok = DATA.peers.filter(p => rank(p) === 'ok').length;
  const totalFleet = DATA.self.fleet.length + DATA.peers.reduce((a, p) => a + p.fleet.length, 0);
  return html`<div>
    <h1>🌐 maw federation · fleet map</h1>
    <div class="sub">${ok}/${DATA.peers.length} peers healthy · ${totalFleet} sessions across ${1 + DATA.peers.filter(p => p.fleet.length).length} machines · cached</div>
    <div class="grid"><${Self} s=${DATA.self} />${DATA.peers.map(p => html`<${Card} p=${p} key=${p.alias} />`)}</div>
    <div class="foot">React + htm (JSX-like, zero build) · data from /fed.json · ~6KB vendored with preact</div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
